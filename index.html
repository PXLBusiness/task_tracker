<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header" id="header">
      <div class="header-content">
        <img id="appLogo" class="app-logo" style="display: none;" alt="Logo">
        <h1 id="appTitle">⏱ Time Tracker</h1>
      </div>
      <button id="closeBtn" class="close-btn" title="Close (Alt+T)">✕</button>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Left: Timer Form -->
      <div class="form-section">
        <div class="mode-toggle">
          <button id="timerModeBtn" class="mode-btn active">Start Timer</button>
          <button id="manualModeBtn" class="mode-btn">Manual Entry</button>
        </div>

        <!-- Timer Mode -->
        <form id="timerForm" class="timer-form">
          <div class="form-group">
            <label for="clientSelect">Client</label>
            <select id="clientSelect" required tabindex="1">
              <option value="">Select client...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="projectSelect">Project</label>
            <select id="projectSelect" required tabindex="2">
              <option value="">Select project...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskInput">Task Name</label>
            <input type="text" id="taskInput" placeholder="e.g., Homepage design" required tabindex="3">
          </div>

          <button type="submit" class="start-btn" tabindex="4">▶ Start Timer</button>
        </form>

        <!-- Manual Mode (Hidden by default) -->
        <form id="manualForm" class="manual-form" style="display: none;">
          <div class="form-group">
            <label for="manualClient">Client</label>
            <select id="manualClient" required tabindex="1">
              <option value="">Select client...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="manualProject">Project</label>
            <select id="manualProject" required tabindex="2">
              <option value="">Select project...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="manualTask">Task Name</label>
            <input type="text" id="manualTask" placeholder="e.g., Email template" required tabindex="3">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="manualStart">Start Time</label>
              <input type="datetime-local" id="manualStart" required tabindex="4">
            </div>
            <div class="form-group">
              <label for="manualDuration">Duration (HH:MM)</label>
              <input type="text" id="manualDuration" placeholder="01:30" pattern="[0-9]{1,2}:[0-9]{2}" required tabindex="5">
            </div>
          </div>

          <div class="form-group">
            <label for="manualNote">Note (optional)</label>
            <textarea id="manualNote" rows="2" placeholder="Additional details..." tabindex="6"></textarea>
          </div>

          <button type="submit" class="start-btn" tabindex="7">📝 Log Entry</button>
        </form>
      </div>

      <!-- Right: Active Timers -->
      <div class="active-timers">
        <h3>Active Timers</h3>
        <div id="timersList" class="timers-list">
          <p class="empty-state">No active timers</p>
        </div>
      </div>
    </div>

    <!-- Footer Stats -->
    <div class="footer">
      <div class="stats">
        <span>Today: <strong id="statsToday">0.0</strong> hrs</span>
        <span>Week: <strong id="statsWeek">0.0</strong> hrs</span>
        <span>Month: <strong id="statsMonth">0.0</strong> hrs</span>
      </div>
      <div class="footer-actions">
        <button id="refreshClientsBtn" class="footer-icon-btn" title="Refresh Clients" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
          </svg>
        </button>
        <span id="webhookStatus" class="webhook-status">⚙️ Configure webhook in settings</span>
      </div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-icon" id="modalIcon">ℹ️</div>
      <h3 id="modalTitle">Notification</h3>
      <p id="modalMessage">Message goes here</p>
      <div class="modal-buttons">
        <button id="modalConfirm" class="modal-btn modal-btn-primary">OK</button>
        <button id="modalCancel" class="modal-btn modal-btn-secondary" style="display: none;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
